<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>¡Feliz cumpleaños!</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:VT323,monospace;font-size:26px;color:#fff;background:#070b24}
img{image-rendering:pixelated}
button{font:inherit;color:inherit}
#sky{position:fixed;inset:0;z-index:0}
#stars{position:absolute;inset:0 0 40% 0}
#stars i{position:absolute;width:3px;height:3px;background:#fff;animation:tw 3s infinite steps(2)}
@keyframes tw{50%{opacity:.25}}
#orb{position:absolute;width:64px;height:64px;transform:translate(-50%,-50%)}
#land{position:fixed;left:0;right:0;bottom:0;z-index:0;display:flex;align-items:flex-end;overflow:hidden;pointer-events:none}
#land div{flex:none;width:32px}
#fx{position:fixed;inset:0;z-index:40;pointer-events:none}
main{position:relative;z-index:1}
section,header{max-width:760px;margin:0 auto;padding:0 18px}
section{padding-top:16vh;padding-bottom:6vh}
h2{font:clamp(13px,3.6vw,18px)/1.6 'Press Start 2P',monospace;margin:0 0 26px;text-shadow:3px 3px 0 #1a1a1a}
.btn{font-family:'Press Start 2P',monospace;font-size:11px;padding:14px 18px;background:#7d7d7d;border:4px solid #000;box-shadow:inset 3px 3px 0 #b5b5b5,inset -3px -3px 0 #4a4a4a;text-shadow:2px 2px #3a3a3a;cursor:pointer}
.btn:hover,.btn:focus-visible{background:#6c7ec9;outline:none}
.btn:disabled{opacity:.4;cursor:default;background:#7d7d7d}
/* Hero */
header{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
#t1,#t2{font-family:'Press Start 2P',monospace;margin:0;line-height:1.3;text-shadow:0 4px 0 #8a8a8a,0 8px 0 #333,6px 14px 0 rgba(0,0,0,.4);color:#f2f2f2}
#t1{font-size:clamp(18px,5.4vw,40px)}
#t2{font-size:clamp(28px,10vw,84px);margin-top:18px;color:#ffe066;text-shadow:0 4px 0 #b88a00,0 8px 0 #5a4200,6px 14px 0 rgba(0,0,0,.4);overflow-wrap:anywhere}
.ch{display:inline-block;animation:drop .7s both steps(7)}
@keyframes drop{from{transform:translateY(-140px);opacity:0}}
#sub{margin:34px 0 0;font-size:clamp(24px,5vw,32px);text-shadow:2px 2px #1a1a1a;animation:fade 1s 1.8s both}
#cue{margin-top:46px;font:10px 'Press Start 2P',monospace;text-shadow:2px 2px #000;animation:fade 1s 2.4s both,bob 1s 2.4s infinite steps(2)}
@keyframes fade{from{opacity:0}}
@keyframes bob{50%{transform:translateY(8px)}}
/* Libro */
.book{position:relative;background:#f1e1b4;color:#3b2a14;border:6px solid #3b2410;box-shadow:inset 0 0 0 4px #c9a96a,10px 10px 0 rgba(0,0,0,.35);padding:34px 30px 30px 52px;min-height:360px;perspective:1100px;display:flex;flex-direction:column}
.book:before{content:'';position:absolute;left:30px;top:0;bottom:0;width:4px;background:#c9a96a}
.sheet{flex:1;font-size:30px;line-height:1.15;transform-origin:left center}
.sheet.turn{animation:turn .45s}
@keyframes turn{from{transform:rotateY(-75deg);opacity:0}}
.sheet h3{font:13px/1.6 'Press Start 2P',monospace;color:#8a1f1f;margin:0 0 18px}
.sheet p{margin:0 0 14px}
.sheet .sign{text-align:right;color:#8a1f1f}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:20px;font-size:24px;color:#6b4b22}
/* Logros */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.adv{display:flex;gap:14px;align-items:center;padding:14px;background:#2b2b2b;border:4px solid #555;color:#8d8d8d;transition:.5s}
.adv img{width:44px;height:44px;object-fit:contain;filter:grayscale(1) brightness(.5);transition:.5s;flex:none}
.adv b{display:block;font:10px/1.6 'Press Start 2P',monospace;color:#777;margin-bottom:6px;font-weight:400}
.adv span{font-size:23px;line-height:1.05}
.adv.on{background:#1c2a1c;border-color:#ffd23f;color:#e8ffe8}
.adv.on img{filter:none}
.adv.on b{color:#ffe066}
/* Inventario */
.gui{background:#c6c6c6;border:4px solid;border-color:#fff #555 #555 #fff;box-shadow:8px 8px 0 rgba(0,0,0,.35);padding:16px;color:#3f3f3f}
#slots{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.slot{aspect-ratio:1;background:#8b8b8b;border:3px solid;border-color:#373737 #fff #fff #373737;display:grid;place-items:center;cursor:pointer;padding:0}
.slot img{width:62%}
.slot:hover,.slot:focus-visible,.slot.sel{background:#b4b4b4;outline:3px solid #fff}
/* Tip Horizontal */
#tip{margin-top:16px;background:#100010;border:4px solid #2a0a5e;box-shadow:inset 0 0 0 2px #1a0540;padding:14px 16px;color:#fff;min-height:90px;display:flex;align-items:center;gap:16px;}
#tip-icon{width:52px;height:52px;flex:none;display:grid;place-items:center;background:#220945;border:2px solid #52199e;}
#tip-icon img{width:65%;height:65%;object-fit:contain;image-rendering:pixelated;}
#tip-content{display:flex;flex-direction:column;justify-content:center;}
#tip b{display:block;font:11px/1.6 'Press Start 2P',monospace;margin-bottom:4px;font-weight:400}
#tip span{color:#a8a8ff;font-size:25px;line-height:1.1}
/* Final */
#fin{text-align:center}
#cake{width:min(60vw,240px);cursor:pointer;display:block;margin:0 auto 26px}
#cake.lit{animation:glow 1.2s infinite steps(2)}
@keyframes glow{50%{filter:drop-shadow(0 0 16px #ffb02e)}}
#wish{margin:22px 0 0;font-size:30px;text-shadow:2px 2px #1a1a1a;min-height:34px}
footer{position:relative;z-index:1;text-align:center;padding:60px 18px 150px;font-size:28px;text-shadow:2px 2px #1a1a1a}
@media(max-width:560px){.grid{grid-template-columns:1fr}#slots{grid-template-columns:repeat(3,1fr)}.book{padding:26px 20px 22px 40px}.book:before{left:20px}.sheet{font-size:27px}#tip{flex-direction:column;align-items:flex-start;}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="sky"><div id="stars"></div><div id="orb"></div></div>
<div id="land"></div>
<canvas id="fx"></canvas>

<main>
  <header>
    <h1 id="t1" style="margin:0"></h1>
    <div id="t2"></div>
    <p id="sub"></p>
    <div id="cue">Sigue bajando</div>
  </header>

  <section id="carta">
    <h2>La carta</h2>
    <div class="book">
      <div class="sheet" id="sheet"></div>
      <div class="nav">
        <button class="btn" id="prev">Atrás</button>
        <span id="pg"></span>
        <button class="btn" id="next">Siguiente</button>
      </div>
    </div>
  </section>

  <section id="logros">
    <h2>Logros desbloqueados</h2>
    <div class="grid" id="lg"></div>
  </section>

  <section id="inv">
    <h2>Tu inventario de deseos</h2>
    <div class="gui">
      <div id="slots"></div>
      <div id="tip">
        <div id="tip-icon"></div>
        <div id="tip-content">
          <b>Toca un objeto</b><span>Cada uno guarda un deseo para ti.</span>
        </div>
      </div>
    </div>
  </section>

  <section id="fin">
    <h2>Un último detalle</h2>
    <img id="cake" alt="Pastel con velas">
    <button class="btn" id="blow">Soplar las velas</button>
    <p id="wish"></p>
  </section>

  <footer id="foot"></footer>
</main>

<script>
const CFG = {
  name: "IAN",
  from: "Joshua",
  age: 13,
  letter: [
    "Hoy empieza un nuevo nivel en tu mundo, y prepare esta sorpresa esperando que te guste mucho.",
    "Gracias por las aventuras, las risas y todos los momentos de siempre. Eres alguien que vale más que un diamante.",
    "Ojalá este año encuentres muchos tesoros, nunca se te acaben los bloques y los creepers siempre exploten lejos de ti.",
    "¡Feliz cumpleaños! Un poco viejo, pero lleno de experiencia."
  ],
  logros: [
    ["¡Diamantes!", "Encontraste los momentos más valiosos gracias a tu esfuerzo"],
    ["Herramientas de Netherite", "Desmostraste tener resistencia ante los problemas."],
    ["¿Cómo llegamos aqui?", "Tuviste tantas aventuras que no sabes como terminaste aquí"],
    ["¿Un nuevo principio?", "Has completado una etapa, comienza otra nueva."]
  ],
  deseos: [
    ["Barra de vida llena", "Que siempre tengas salud y ánimo al máximo."],
    ["Antorcha", "Que nunca te falte luz en los días grises ."],
    ["Mesa de encantamientos", "Que todo lo que hagas salga mejor."],
    ["Brújula", "Que nunca pierdas el rumbo."],
    ["Elytra", "Que este año llegues muy alto."],
    ["Cofre del tesoro", "Que cada día guarde una sorpresa."]
  ]
};

const $ = s => document.querySelector(s);
let seed = 11;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const N = (r, g, b, a = 36) => { const d = (rnd() - .5) * a; return `rgb(${r + d | 0},${g + d | 0},${b + d | 0})`; };
function tex(w, h, f) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) { const v = f(i, j); if (v) { x.fillStyle = v; x.fillRect(i, j, 1, 1); } }
  return c.toDataURL();
}
const art = (rows, pal) => tex(rows[0].length, rows.length, (x, y) => pal[rows[y][x]] || null);
const cake = lit => tex(16, 16, (x, y) => {
  if (x < 2 || x > 13) return null;
  if (y <= 2) return lit && [4, 8, 11].includes(x) ? (y == 1 ? '#ff7a00' : '#ffd23f') : null;
  if (y <= 5) return [4, 8, 11].includes(x) ? (y == 4 ? '#e33' : '#fff') : null;
  if (y <= 8) return N(255, 214, 232, 12);
  if (y <= 13) return y == 11 ? '#d6336c' : N(150, 80, 40, 20);
  return '#ddd';
});

/* NUEVOS ÍCONOS ACTUALIZADOS (INCLUYENDO BRÚJULA Y COFRE) */
const DI = [
  art(['.rr..rr.','rRRrrRRr','rRRRRRRr','rRRRRRRr','.rRRRRr.','..rRRr..','...rr...'], { r: '#3a0000', R: '#ff2222' }),
  art(['..yy..','.yOOy..','..kk..','..bb..','..bb..','..bb..','..bb..'], { y: '#ffff55', O: '#ff7700', k: '#3a2200', b: '#855223' }),
  art(['...rr...','..rBBr..','.cddddc.','cccccccc','bkkkkkkb','bkkkkkkb'], { r: '#aa1111', B: '#ffffff', c: '#5decf5', d: '#dddddd', b: '#4a4a5a', k: '#181124' }),
  art(['...gg...','..gwwg..','.gwrwg..','.gwrwg..','..gwwg..','...gg...'], { g: '#888888', w: '#ffffff', r: '#cc2222' }),
  art(['kkk..kkk','kggkkggk','kgk..kgk','kgk..kgk','kk....kk'], { k: '#2b2d38', g: '#737a91' }),
  art(['........','.iiiiii.','.iooioo.','.ioyioo.','.iooioo.','.iiiiii.'], { i: '#63411e', o: '#38220f', y: '#ffcc00' })
];

const LI = [
  art(['..ccccc..','.cwwwwwc.','cwwwwwbb','.cwwwbb.','..cwbb..','...cb...','....b...'], { c: '#5decf5', w: '#ffffff', b: '#1fa9b8' }),
  art(['........','.lllllll','.lddddddk','.lmmmmmk','.kkkkkkk'], { l: '#7a6666', d: '#4a3d3d', m: '#3a2f2f', k: '#241c1c' }),
  art(['bbbbbbbbb','bppppRpRb','bpppppRpb','bpppdRpRb','bppdppppb','bpdpppgpb','bpppgggpb','bbbbbbbbb'], { b: '#8a5a2b', p: '#e8d29b', d: '#7a5a2b', R: '#d32f2f', g: '#5fa83a' }),
  art(['..ggg..','.gGgGg.','ggGggGg','.gggGg.','...n...','...n...','.ddndd.','ddddddd'], { g: '#4caf50', G: '#9be37c', n: '#6b4423', d: '#7a5230' })
];

const GRASS = tex(16, 16, (x, y) => y < 4 || (y < 6 && rnd() < .4) ? N(95, 159, 53, 30) : N(134, 96, 67));
const DIRT = tex(16, 16, () => N(134, 96, 67));

$('#t1').textContent = '';
function letters(el, txt, d0) {
  el.innerHTML = [...txt].map((c, i) => `<span class="ch" style="animation-delay:${d0 + i * 45}ms">${c == ' ' ? '&nbsp;' : c}</span>`).join('');
}
letters($('#t1'), 'Feliz cumpleaños', 200);
letters($('#t2'), CFG.name, 200 + 16 * 45);
$('#sub').textContent = `Hoy subes al nivel ${CFG.age}`;
document.title = `¡Feliz cumpleaños, ${CFG.name}!`;
$('#foot').textContent = `Con cariño, ${CFG.from}`;

const stars = $('#stars');
for (let i = 0; i < 70; i++) {
  const s = document.createElement('i');
  s.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 100}%;animation-delay:-${Math.random() * 3}s`;
  stars.append(s);
}
const stops = [[0, '#070b24', '#1a2a63'], [.3, '#3a3478', '#ff9a6b'], [.6, '#4aa8ff', '#bfe6ff'], [1, '#241a4f', '#ff7a5a']];
const hx = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const cl = v => Math.min(1, Math.max(0, v));
const orb = $('#orb'), sk = $('#sky');
function sky() {
  const p = cl(scrollY / Math.max(1, document.documentElement.scrollHeight - innerHeight));
  let i = 0; while (i < stops.length - 2 && p > stops[i + 1][0]) i++;
  const a = stops[i], b = stops[i + 1], t = cl((p - a[0]) / (b[0] - a[0]));
  sk.style.background = `linear-gradient(rgb(${mix(hx(a[1]), hx(b[1]), t)}),rgb(${mix(hx(a[2]), hx(b[2]), t)}))`;
  stars.style.opacity = Math.max(1 - p / .3, (p - .8) / .2, 0);
  let c = mix([230, 236, 255], [255, 227, 106], cl(p / .3));
  c = mix(c, [255, 138, 80], cl((p - .8) / .2));
  orb.style.cssText = `left:${8 + p * 84}%;top:${70 - Math.sin(Math.PI * p) * 55}%;background:rgb(${c});box-shadow:0 0 0 8px rgba(${c},.35),0 0 50px 16px rgba(${c},.45)`;
}
addEventListener('scroll', sky, { passive: true });

function land() {
  const L = $('#land'); L.innerHTML = '';
  let h = 2;
  for (let i = 0; i < Math.ceil(innerWidth / 32) + 1; i++) {
    h = Math.max(1, Math.min(4, h + (Math.random() < .35 ? (Math.random() < .5 ? -1 : 1) : 0)));
    const d = document.createElement('div');
    d.style.cssText = `height:${h * 32}px;background:url(${GRASS}) 0 0/32px 32px no-repeat,url(${DIRT}) 0 0/32px 32px repeat-y`;
    L.append(d);
  }
}
land(); addEventListener('resize', land);

let AC;
function beep(f, d = .12, v = .05, w = 0, t = 'square') {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), s = AC.currentTime + w;
  o.type = t; o.frequency.value = f;
  g.gain.setValueAtTime(v, s); g.gain.exponentialRampToValueAtTime(.0001, s + d);
  o.connect(g).connect(AC.destination); o.start(s); o.stop(s + d);
}
const au = () => { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); };
function melody() {
  const n = [[392,.4],[392,.2],[440,.6],[392,.6],[523,.6],[494,1.1],[392,.4],[392,.2],[440,.6],[392,.6],[587,.6],[523,1.1],[392,.4],[392,.2],[784,.6],[659,.6],[523,.6],[494,.6],[440,.8],[698,.4],[698,.2],[659,.6],[523,.6],[587,.6],[523,1.1]];
  let t = 0; n.forEach(([f, d]) => { beep(f, d * .55, .05, t); t += d * .6; });
}
const fx = $('#fx'), cx = fx.getContext('2d');
let P = [], run = false;
const rs = () => { fx.width = innerWidth; fx.height = innerHeight; };
addEventListener('resize', rs); rs();
const COL = ['#5decf5', '#7ef32a', '#ffd23f', '#ff5c8a', '#fff', '#b86bff', '#ff8a2a'];
function burst(x, y, n = 40) {
  for (let i = 0; i < n; i++) P.push({ x, y, vx: (Math.random() - .5) * 16, vy: -Math.random() * 9 - 2, s: 4 + Math.random() * 8 | 0, c: COL[Math.random() * COL.length | 0], l: 70 + Math.random() * 50 });
  if (!run) { run = true; requestAnimationFrame(loop); }
}
function loop() {
  cx.clearRect(0, 0, fx.width, fx.height);
  P = P.filter(p => p.l-- > 0);
  P.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; cx.globalAlpha = Math.min(1, p.l / 20); cx.fillStyle = p.c; cx.fillRect(p.x, p.y, p.s, p.s); });
  if (P.length) requestAnimationFrame(loop); else { run = false; cx.clearRect(0, 0, fx.width, fx.height); }
}
function party() { for (let i = 0; i < 8; i++) setTimeout(() => burst(Math.random() * innerWidth, innerHeight * (.15 + Math.random() * .4)), i * 140); }

let pg = 0;
const sheet = $('#sheet'), L = CFG.letter;
function page(turn) {
  const last = pg == L.length - 1;
  sheet.innerHTML = (pg == 0 ? `<h3>Querido ${CFG.name},</h3>` : '') + `<p>${L[pg]}</p>` + (last ? `<p class="sign">— ${CFG.from}</p>` : '');
  $('#pg').textContent = `Página ${pg + 1} de ${L.length}`;
  $('#prev').disabled = pg == 0; $('#next').disabled = last;
  if (turn) { sheet.classList.remove('turn'); void sheet.offsetWidth; sheet.classList.add('turn'); }
}
$('#prev').onclick = () => { au(); if (pg > 0) { pg--; page(1); beep(300, .08, .04); } };
$('#next').onclick = () => { au(); if (pg < L.length - 1) { pg++; page(1); beep(420, .08, .04); } };
addEventListener('keydown', e => { if (e.key == 'ArrowLeft') $('#prev').click(); if (e.key == 'ArrowRight') $('#next').click(); });
page(0);

$('#lg').innerHTML = CFG.logros.map((a, i) => `<div class="adv"><img src="${LI[i % LI.length]}" alt=""><div><b>${a[0]}</b><span>${a[1]}</span></div></div>`).join('');
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { const el = e.target; setTimeout(() => { el.classList.add('on'); beep(880, .1, .03); }, [...el.parentNode.children].indexOf(el) * 180); io.unobserve(el); }
}), { threshold: .6 });
document.querySelectorAll('.adv').forEach(el => io.observe(el));

/* ----- Inventario Horizontal ----- */
const tipIcon = $('#tip-icon'), tipContent = $('#tip-content');
function show(i) {
  tipIcon.innerHTML = `<img src="${DI[i]}" alt="">`;
  tipContent.innerHTML = `<b>${CFG.deseos[i][0]}</b><span>${CFG.deseos[i][1]}</span>`;
  document.querySelectorAll('.slot').forEach((s, k) => s.classList.toggle('sel', k == i));
}
$('#slots').innerHTML = CFG.deseos.map((d, i) => `<button class="slot" aria-label="${d[0]}"><img src="${DI[i]}" alt=""></button>`).join('');
document.querySelectorAll('.slot').forEach((s, i) => {
  s.onmouseenter = s.onfocus = () => show(i);
  s.onclick = e => { au(); show(i); beep(660 + i * 60, .1, .04); const r = s.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, 14); };
});
tipIcon.innerHTML = '';
tipContent.innerHTML = '<b>Toca un objeto</b><span>Cada uno guarda un deseo para ti.</span>';

const C1 = cake(true), C0 = cake(false); let lit = true;
function setCake() { $('#cake').src = lit ? C1 : C0; $('#cake').classList.toggle('lit', lit); $('#blow').textContent = lit ? 'Soplar las velas' : 'Encender otra vez'; }
function blow() {
  au();
  if (lit) {
    lit = false; $('#wish').textContent = '¡Pide un deseo!';
    const r = $('#cake').getBoundingClientRect(); burst(r.left + r.width / 2, r.top, 60); party(); melody();
    setTimeout(() => { if (!lit) $('#wish').textContent = '¡Que se cumpla todo lo que pediste!'; }, 2200);
  } else { lit = true; $('#wish').textContent = ''; beep(500, .1, .04); }
  setCake();
}
$('#blow').onclick = $('#cake').onclick = blow;
setCake();
sky();
</script>
</body>
</html>
